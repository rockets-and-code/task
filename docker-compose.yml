# Optional. Part A does not need a database; this is here in case your design
# wants one. `docker compose up -d` and connect on localhost:5433.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tariff
      POSTGRES_PASSWORD: tariff
      POSTGRES_DB: tariff
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tariff"]
      interval: 5s
      timeout: 3s
      retries: 10
